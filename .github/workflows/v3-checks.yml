name: V3 checks

on:
  push:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-checks.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-checks.yml'

permissions:
  contents: read

concurrency:
  group: v3-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: v3/api/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run isolated API and import tests
        run: python -m pytest -q --junitxml="${RUNNER_TEMP}/v3-api-tests.xml"
      - name: Verify fresh migrations and model consistency
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/difedegames_v3_ci.sqlite
        run: |
          alembic upgrade head
          alembic check
      - name: Retain API failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-api-failure
          path: ${{ runner.temp }}/v3-api-tests.xml
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: PostgreSQL 16 concurrency and streams
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3/api
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_DB: difedegames_v3_test
          POSTGRES_USER: v3_ci
          POSTGRES_PASSWORD: ci-only-v3-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v3_ci -d difedegames_v3_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://v3_ci:ci-only-v3-password@127.0.0.1:5432/difedegames_v3_test
      ACCEPTANCE_RESET_DATABASE: difedegames_v3_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: v3/api/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run synthetic two-worker PostgreSQL acceptance
        run: python ../acceptance/postgres_http.py > "${RUNNER_TEMP}/v3-postgres-acceptance.json"
      - name: Retain PostgreSQL failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-postgres-failure
          path: ${{ runner.temp }}/v3-postgres-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web tests, production build, and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v3/web
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v3/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run component and score-queue tests
        run: npm test
      - name: Build production web bundle
        run: npm run build
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run mocked browser reliability checks
        run: npm run test:browser -- --workers=2 --reporter=line,html --trace=retain-on-failure
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-web-failure
          path: |
            v3/web/test-results/
            v3/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
