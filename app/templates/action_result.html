{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 560px;">
  <div class="card" style="border: none; border-radius: 12px; background: var(--df-surface); color: var(--df-text); box-shadow: 0 2px 12px rgba(0,0,0,0.1);">
    <div class="card-body text-center p-4">
      {% if success %}
      <i class="fas fa-check-circle mb-3" style="font-size: 3rem; color: #28a745;"></i>
      {% else %}
      <i class="fas fa-exclamation-circle mb-3" style="font-size: 3rem; color: #dc3545;"></i>
      {% endif %}
      <h3 style="font-weight: 700;">{{ title }}</h3>
      <p style="color: var(--df-muted);">{{ message }}</p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">Go to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
