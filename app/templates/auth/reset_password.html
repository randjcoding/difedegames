{% extends "base.html" %}
{% block title %}Reset Password - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow" style="background:#fff;color:#212529;">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="card-title" style="color:#212529;">Choose a New Password</h2>
            <p class="text-muted mb-0">Resetting password for {{ email }}</p>
          </div>
          <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <input type="password" class="form-control" id="password" name="password" required autofocus
                     minlength="8" autocomplete="new-password">
              <div class="form-text">At least 8 characters, with upper, lower, a number, and a special character.</div>
            </div>
            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required
                     minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Update Password</button>
          </form>
          <div class="text-center">
            <a href="{{ url_for('auth.login') }}">Back to sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
