services:
  db:
    image: postgres:16
    container_name: difede-games-db
    environment:
      POSTGRES_DB: ${PG_DATABASE:-difedeappv2}
      POSTGRES_USER: ${PG_USER:-difedeapp}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Any .sql/.sh in this folder runs automatically the FIRST time the DB
      # is created (empty data dir). Drop your backup here to auto-restore.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-difedeapp} -d ${PG_DATABASE:-difedeappv2}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: difede-games-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    # No fixed container_name — required for: docker compose up -d --scale web=N
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-difedeappv2}
      PG_USER: ${PG_USER:-difedeapp}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: "false"
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_SENDER: ${EMAIL_SENDER:-randjcoding@gmail.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-DiFede Games}
      APP_BASE_URL: ${APP_BASE_URL:-https://games.difedes.com}
      # Enables SocketIO broadcasts across scaled web replicas
      REDIS_URL: redis://redis:6379/0
    # No host ports — nginx (proxy) is the only public entry on localhost:5002
    expose:
      - "5002"
    volumes:
      - sessions:/app/flask_session
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: difede-games-proxy
    depends_on:
      - web
    ports:
      # Localhost only — Cloudflare Tunnel points games.difedes.com here
      - "127.0.0.1:5002:5002"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5002/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  dbdata:
  sessions:
