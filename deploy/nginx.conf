worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;

    # Docker Compose embedded DNS — re-resolve so scaled web containers stay reachable
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Sticky sessions are required for Socket.IO (live scores). ip_hash keeps a
    # browser on the same web replica. Container names match:
    #   docker compose up -d --scale web=2
    # If you change the scale, update the server lines below.
    upstream difede_web {
        ip_hash;
        server difedegames-web-1:5002 max_fails=3 fail_timeout=10s;
        server difedegames-web-2:5002 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 5002;
        server_name _;

        client_max_body_size 20m;

        location / {
            proxy_pass http://difede_web;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade          $http_upgrade;
            proxy_set_header Connection       $connection_upgrade;

            # Long-lived Socket.IO / WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location = /lb-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
